version: "3.8"
services:
  # 1. Contenedor NGINX
  wolfs-app:
    image: nginx:alpine
    container_name: wolfs_site
    volumes:
      # Monta la carpeta de tu sitio web (mantener como solo lectura :ro es buena práctica)
      - .:/usr/share/nginx/html:ro
      # CRÍTICO: Monta tu archivo de configuración SIN :ro para permitir la inicialización del contenedor
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8081:80"
    networks:
      - wolfs_network
    restart: always

  # 2. Contenedor Cloudflare Tunnel
  cloudflared:
      image: cloudflare/cloudflared:latest
      container_name: cloudflared_tunnel
      # CRÍTICO: Ejecutar como Root para asegurar la lectura de credenciales
      user: "0"
      # Monta la carpeta de credenciales
      volumes:
        - /home/druida/.cloudflared:/etc/cloudflared
      # CRÍTICO: Usamos el comando más simple y que incluye el UUID del túnel
      command: ["tunnel", "run", "d31fd205-eafc-4f1f-bac8-f45c2c3a4f63"]
      networks:
        - wolfs_network
      restart: always

networks:
  wolfs_network:
    driver: bridge
