version: "3.8"
services:
  wolfs-app:
    image: nginx:alpine
    container_name: wolfs_site
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    networks:
      - wolfs_network
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    # Ejecutar como root sólo si es absolutamente necesario
    user: "0"
    volumes:
      # No incluir credenciales en el repo; montar desde fuera del repo en producción
      - "${CLOUDFLARED_CREDENTIALS_PATH:-./cloudflared}:/etc/cloudflared:ro"
    command: ["tunnel", "run", "${CLOUDFLARE_TUNNEL_ID}"]
    networks:
      - wolfs_network
    restart: always

networks:
  wolfs_network:
    driver: bridge
